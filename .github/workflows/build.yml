name: Build Godot Android APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4
      - name: Unpack game.zip
        run: unzip -o game.zip -d .
      - name: Setup templates and editor settings
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true
          cp -n /root/.config/godot/editor_settings-4*.tres ~/.config/godot/ || true
      - name: Import project
        run: godot --headless --verbose --import || true
      - name: Export APK
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --export-debug "Android" build/android/DarkForest.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android
